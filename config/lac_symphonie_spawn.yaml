# Start poses for vrx_gz competition.launch.py config_file:=...  Local metres in the
# world frame (x east, y north, z = water level); convert real positions with
# scripts/latlon_to_local.py.  Default: next to launch_site in geo_points.yaml
# (49.1041283 N, 6.2164558 E), bow pointing north.  Only the Kingfisher is spawned by default;
# uncomment the WAM-V entry to spawn both.
- model_name: kingfisher
  model_type: usv
  urdf: package://kingfisher_gazebo/urdf/kingfisher_gazebo.urdf.xacro
  position:
    xyz: [-47.92, 67.33, 0.12]
    rpy: [0, 0, 1.5708]
